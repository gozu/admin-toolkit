<svg width="160" height="100" viewBox="0 0 160 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dataiku-bird-loader-title dataiku-bird-loader-desc">
  <title id="dataiku-bird-loader-title">Dataiku bird eating pellets</title>
  <desc id="dataiku-bird-loader-desc">A static white Dataiku bird mark with separate pellet dots prepared for later loader animation.</desc>
  <style>
    .bird-loader__bird,
    .bird-loader__pellet {
      fill: #fffef9;
    }

    .bird-loader__pellet--trail {
      opacity: 0.72;
    }

    .bird-loader__pellet--far {
      opacity: 0.42;
    }
  </style>
  <defs>
    <mask id="dataiku-bird-loader-mouth-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="100">
      <rect width="160" height="100" fill="white"/>
      <path d="M97.5 18.5L127 6.5L120 35Z" fill="black"/>
    </mask>
  </defs>
  <g class="bird-loader__pellets">
    <circle class="bird-loader__pellet bird-loader__pellet--bite" cx="112.5" cy="22.5" r="4.1"/>
    <circle class="bird-loader__pellet bird-loader__pellet--trail" cx="132" cy="22.5" r="3.9"/>
    <circle class="bird-loader__pellet bird-loader__pellet--far" cx="148.5" cy="22.5" r="3.6"/>
  </g>
