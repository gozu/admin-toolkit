<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dataiku Diagnostics</title>
    <!-- Google Fonts preconnect — actual families (Roboto + JetBrains Mono) are loaded via src/index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      /* Log viewer styling */
      .log-viewer {
        color: #f8f8f2;
        line-height: 1.4;
      }

      .log-viewer .log-error {
        color: #ff6b6b;
        background-color: rgba(255, 107, 107, 0.1);
      }

      .log-viewer .log-warn {
        color: #ffd93d;
      }

      .log-viewer .log-info {
        color: #6bcb77;
      }

      .log-viewer .log-debug {
        color: #a8a8a8;
      }

      .log-viewer .log-trace {
        color: #666666;
      }

      .log-viewer .log-default {
        color: #f8f8f2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
